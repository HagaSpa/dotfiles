draw_config:
  dark_mode: auto
  n_columns: 1
  append_colon_to_layer_header: false

parse_config:
  # Supplying qmk_keycode_map here would REPLACE the built-in one (MINS -> "-"
  # etc.), so per-binding overrides go through raw_binding_map instead.
  raw_binding_map:
    "LGUI_T(KC_LNG2)": {t: 英数, h: Cmd}
    "RGUI_T(KC_LNG1)": {t: かな, h: Cmd}
    "RCAG_T(KC_SCLN)": {t: ";", h: ⌘⌥⌃}
    "LT(_FN, KC_S)": {t: S, h: FN}
    "LT(_NAV, KC_D)": {t: D, h: NAV}
    "LSFT_T(KC_F)": {t: F, h: Shift}
    "RSFT_T(KC_ENT)": {t: Enter, h: Shift}
    "LALT(KC_LEFT)": ⌥←
    "LALT(KC_RGHT)": ⌥→
    "KC_LEFT": ←
    "KC_DOWN": ↓
    "KC_UP": ↑
    "KC_RGHT": →
    "KC_PGUP": PgUp
    "KC_PGDN": PgDn
    "KC_DEL": Del
    "KC_LCTL": Ctrl
    "KC_LSFT": Shift
    "KC_RSFT": Shift
    "KC_LALT": Opt
    "MO(_FN)": {t: FN, h: hold}
    "TG(_ADJUST)": {t: ADJUST, h: toggle}
    "QK_BOOT": BOOT
